spring:
  application:
    name: catalog
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/catalog}
    username: ${DB_USER:catalog}
    password: ${DB_PASSWORD:catalog}
    hikari:
      maximum-pool-size: 10
  jooq:
    sql-dialect: POSTGRES
  jackson:
    default-property-inclusion: non_null
  liquibase:
    change-log: classpath:db/changelog-master.yaml
    contexts: production
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDP_JWK_SET_URI:https://idp.example.com/realms/catalog/protocol/openid-connect/certs}
          issuer-uri: ${IDP_ISSUER_URI:https://idp.example.com/realms/catalog}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    ru.remodov.catalog: DEBUG
