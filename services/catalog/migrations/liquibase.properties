# Liquibase CLI defaults для запуска миграций без Gradle.
#
# Использование:
#   cd migrations
#   liquibase update
#   liquibase status
#   liquibase rollback-count --count=1
#   liquibase history
#
# Параметры подключения переопределяются через ENV (LIQUIBASE_COMMAND_URL и т.п.)
# или флагами --url=... в командной строке.

changeLogFile=db/changelog-master.yaml
url=jdbc:postgresql://localhost:5432/catalog
username=catalog
password=catalog
driver=org.postgresql.Driver
contexts=production
logLevel=info
