spring:
  application:
    name: customer
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/customer}
    username: ${CUSTOMER_DB_USER:customer}
    password: ${CUSTOMER_DB_PASSWORD:customer}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: customer-pool
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: production
  jooq:
    sql-dialect: POSTGRES
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        acks: all
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDP_JWK_SET_URI:http://localhost:8081/realms/marketplace/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      tracking-modes:

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}

customer:
  verification:
    token-length: 32
    token-ttl: PT24H
