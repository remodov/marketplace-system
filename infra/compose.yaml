# Стенд маркетплейса: всё, на чём работают сервисы.
#
# Раньше у каждого сервиса был свой compose, и порты у них совпадали — вместе
# они просто не поднимались. Здесь одна инфраструктура на всю систему: своя база
# на сервис (общей базы у сервисов нет — это правило кейса), один брокер, поиск,
# кэш, документное хранилище и Keycloak.
#
#   docker compose -f infra/compose.yaml up -d
#   docker compose -f infra/compose.yaml ps

name: marketplace

x-pg: &pg
  image: postgres:16-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  postgres-catalog:
    <<: *pg
    container_name: mp-postgres-catalog
    environment: { POSTGRES_USER: catalog, POSTGRES_PASSWORD: catalog, POSTGRES_DB: catalog }
    ports: ["5432:5432"]
    volumes: ["pg-catalog:/var/lib/postgresql/data"]

  postgres-order:
    <<: *pg
    container_name: mp-postgres-order
    environment: { POSTGRES_USER: orders, POSTGRES_PASSWORD: orders, POSTGRES_DB: orders }
    ports: ["5433:5432"]
    volumes: ["pg-order:/var/lib/postgresql/data"]

  postgres-customer:
    <<: *pg
    container_name: mp-postgres-customer
    environment: { POSTGRES_USER: customer, POSTGRES_PASSWORD: customer, POSTGRES_DB: customer }
    ports: ["5434:5432"]
    volumes: ["pg-customer:/var/lib/postgresql/data"]

  postgres-notification:
    <<: *pg
    container_name: mp-postgres-notification
    environment: { POSTGRES_USER: notifications, POSTGRES_PASSWORD: notifications, POSTGRES_DB: notifications }
    ports: ["5435:5432"]
    volumes: ["pg-notification:/var/lib/postgresql/data"]

  postgres-backoffice:
    <<: *pg
    container_name: mp-postgres-backoffice
    environment: { POSTGRES_USER: backoffice, POSTGRES_PASSWORD: backoffice, POSTGRES_DB: backoffice }
    ports: ["5436:5432"]
    volumes: ["pg-backoffice:/var/lib/postgresql/data"]

  postgres-payment:
    <<: *pg
    container_name: mp-postgres-payment
    environment: { POSTGRES_USER: payment, POSTGRES_PASSWORD: payment, POSTGRES_DB: payment }
    ports: ["5437:5432"]
    volumes: ["pg-payment:/var/lib/postgresql/data"]

  # Один брокер на систему: события заказа читают Notification и Payment.
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: mp-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: marketplace-cluster
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Кэш горячих карточек и счётчики лимита частоты в шлюзе.
  redis:
    image: redis:7-alpine
    container_name: mp-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Журнал доставок и шаблоны уведомлений — документы неровной формы.
  mongo:
    image: mongo:7
    container_name: mp-mongo
    restart: unless-stopped
    environment: { MONGO_INITDB_DATABASE: notifications }
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Поиск по каталогу: морфология, опечатки, фасеты.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: mp-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Выдаёт токены; сервисы проверяют подпись локально, в Keycloak не ходят.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: mp-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports: ["8081:8080"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]

volumes:
  pg-catalog:
  pg-order:
  pg-customer:
  pg-notification:
  pg-backoffice:
  pg-payment:
  mongo-data:
